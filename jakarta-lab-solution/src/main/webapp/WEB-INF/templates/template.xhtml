<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title><ui:insert name="title">Recipes</ui:insert> &#8211; Recipes App</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <h:outputStylesheet library="css" name="styles.css"/>
</h:head>
<h:body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <h:link outcome="/index" styleClass="navbar-brand d-flex align-items-center gap-2">
                    <h:graphicImage library="images" name="logo.svg" style="height:32px;width:32px;"/>
                    <span>Recipes</span>
                </h:link>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                        aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"/>
                </button>
                <div class="collapse navbar-collapse" id="navMenu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <h:link outcome="/index" styleClass="nav-link">Home</h:link>
                        </li>
                        <li class="nav-item">
                            <h:link outcome="/cuisines/cuisine-list-view" styleClass="nav-link">Cuisines</h:link>
                        </li>
                        <li class="nav-item">
                            <h:link outcome="/recipes/recipe-list-view" styleClass="nav-link">Recipes</h:link>
                        </li>
                        <li class="nav-item">
                            <h:link outcome="/users/user-list-view" styleClass="nav-link">Users</h:link>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="page-banner text-white text-center py-5">
            <div class="container">
                <h1 class="display-5 fw-semibold"><ui:insert name="heading">Recipes</ui:insert></h1>
                <p class="lead mb-0"><ui:insert name="subheading">Recipes from all over the world in one place</ui:insert></p>
            </div>
        </div>
    </header>

    <main class="container flex-grow-1 my-4">
        <ui:insert name="content">No content.</ui:insert>
    </main>

    <footer class="bg-dark text-light py-4">
        <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 small">
            <span>&#169; Recipes App &#8211; 2026</span>
            <span class="text-secondary">Sambor Seredyński, s198035</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"/>
</h:body>
</html>
